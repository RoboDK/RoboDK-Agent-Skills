name: skill-lint

on:
  push:
    branches: [main]
    paths: ["skills/**"]
  pull_request:
    paths: ["skills/**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/lint_skills.py
